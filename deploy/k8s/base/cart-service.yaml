# Service A: Add to Cart. Its SPIFFE ID is spiffe://example.org/ns/cart/sa/cart-service,
# registered by scripts/spire-bootstrap.sh register. It calls checkout over mutual TLS, presenting
# its X.509-SVID and accepting only the checkout SPIFFE ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-service
  namespace: cart
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: cart
  labels:
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/part-of: spiffe-cart-checkout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cart-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cart-service
        app.kubernetes.io/part-of: spiffe-cart-checkout-demo
    spec:
      serviceAccountName: cart-service
      automountServiceAccountToken: false
      containers:
        - name: cart-service
          image: AR_PREFIX/cart-service:0.1.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent-sockets/spire-agent.sock
            - name: SPIFFE_TRUST_DOMAIN
              value: example.org
            - name: CHECKOUT_BASE_URL
              value: https://checkout-service.checkout.svc.cluster.local
            - name: CHECKOUT_SPIFFE_ID
              value: spiffe://example.org/ns/checkout/sa/checkout-service
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: cart
  labels:
    app.kubernetes.io/name: cart-service
spec:
  selector:
    app.kubernetes.io/name: cart-service
  ports:
    - name: http
      port: 80
      targetPort: http
