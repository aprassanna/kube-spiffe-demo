# Service B: Checkout. Serves /api/** over mutual TLS on 8443. The client certificate must carry
# an X.509-SVID whose SPIFFE ID is on the allow-list (SPIFFE_ALLOWED_CALLERS). Its own SPIFFE ID is
# spiffe://example.org/ns/checkout/sa/checkout-service, registered by scripts/spire-bootstrap.sh.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-service
  namespace: checkout
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-service
    app.kubernetes.io/part-of: spiffe-cart-checkout-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-service
        app.kubernetes.io/part-of: spiffe-cart-checkout-demo
    spec:
      serviceAccountName: checkout-service
      automountServiceAccountToken: false
      containers:
        - name: checkout-service
          image: AR_PREFIX/checkout-service:0.1.0
          imagePullPolicy: Always
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 8081
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent-sockets/spire-agent.sock
            - name: SPIFFE_TRUST_DOMAIN
              value: example.org
            - name: SPIFFE_ALLOWED_CALLERS
              value: spiffe://example.org/ns/cart/sa/cart-service
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: management
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/agent-sockets
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: checkout
  labels:
    app.kubernetes.io/name: checkout-service
spec:
  selector:
    app.kubernetes.io/name: checkout-service
  ports:
    - name: https
      port: 443
      targetPort: https
