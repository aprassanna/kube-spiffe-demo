openapi: 3.0.3
info:
  title: Checkout Service (Service B)
  version: 0.1.0
  description: |
    Service B in the SPIFFE demo. The API listens on HTTPS and requires a client certificate
    (mutual TLS). The client's X.509-SVID must:
      - chain to the SPIRE trust bundle for example.org,
      - carry a SPIFFE ID in its URI SAN that is on the allow-list
        (default spiffe://example.org/ns/cart/sa/cart-service).
    A client without a valid certificate fails at the TLS handshake and never reaches the API.
    Health checks run on a separate plain-HTTP management port (8081) at /actuator/health.
servers:
  - url: https://checkout-service.checkout.svc.cluster.local
    description: In-cluster address (port 443, reachable only with a valid X.509-SVID)
security:
  - mutualTls: []
paths:
  /api/v1/orders:
    post:
      summary: Place an order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order placed. The Location header points to the order.
          headers:
            Location:
              schema:
                type: string
                example: /api/v1/orders/ord_3f2c9d1e-7a5b-4c1e-9d8f-2b6a1c0e4f77
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          $ref: "#/components/responses/ProblemDetail"
        "401":
          description: No client certificate with a SPIFFE ID reached the application.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Valid client certificate, but its SPIFFE ID is not on the allow-list.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/v1/orders/{orderId}:
    get:
      summary: Get an order
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: No client certificate with a SPIFFE ID reached the application.
        "403":
          description: Valid client certificate, but its SPIFFE ID is not on the allow-list.
        "404":
          description: No such order.
components:
  securitySchemes:
    mutualTls:
      type: mutualTLS
      description: X.509-SVID issued by SPIRE, verified against the SPIRE trust bundle during the TLS handshake.
  schemas:
    CreateOrderRequest:
      type: object
      required: [cartId, items]
      properties:
        cartId:
          type: string
          example: demo-cart
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineItem"
    LineItem:
      type: object
      required: [sku, quantity, unitPriceCents]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPriceCents:
          type: integer
          format: int64
          minimum: 0
    OrderResponse:
      type: object
      properties:
        orderId:
          type: string
        cartId:
          type: string
        totalCents:
          type: integer
          format: int64
        status:
          type: string
          example: PLACED
        placedBy:
          type: string
          description: SPIFFE ID of the authenticated caller, taken from its client certificate.
        createdAt:
          type: string
          format: date-time
    ProblemDetail:
      type: object
      description: RFC 9457 problem details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    ProblemDetail:
      description: Validation or request error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
