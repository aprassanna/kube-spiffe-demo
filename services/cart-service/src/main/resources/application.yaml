server:
  port: 8080

spring:
  application:
    name: cart-service

management:
  endpoints:
    web:
      exposure:
        include: health,info

checkout:
  # In-cluster URL of checkout-service. Override with CHECKOUT_BASE_URL.
  base-url: ${CHECKOUT_BASE_URL:http://checkout-service.checkout.svc.cluster.local}
  # JWT-SVID audience. Must match checkout-service spiffe.audience.
  audience: ${CHECKOUT_AUDIENCE:checkout-service}
