# Business API: HTTPS on 8443, mutual TLS with X.509-SVIDs issued by SPIRE.
# The client must present a certificate; the handshake fails otherwise.
server:
  port: 8443
  ssl:
    enabled: true
    bundle: spiffe
    client-auth: need

# Health probes on a separate plain-HTTP port, so kubelet probes need no client certificate.
management:
  server:
    port: 8081
    # Probes stay plain HTTP. Without this, the server.ssl settings above would apply here too.
    ssl:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

spring:
  application:
    name: checkout-service

spiffe:
  # Trust domain of the SPIRE deployment. Must match the SPIRE server configuration.
  trust-domain: ${SPIFFE_TRUST_DOMAIN:example.org}
  # Comma-separated SPIFFE IDs allowed to call /api/**. Authorization is applied after the handshake.
  allowed-callers: ${SPIFFE_ALLOWED_CALLERS:spiffe://example.org/ns/cart/sa/cart-service}
